<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noticias de Tecnología con Resumen IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    #noticias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .noticia {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .noticia img {
      max-width: 100%;
      border-radius: 10px;
    }
    .titulo {
      font-weight: bold;
      font-size: 18px;
      margin: 10px 0;
    }
    .descripcion {
      color: #555;
    }
    .resumen {
      margin-top: 10px;
      font-style: italic;
      color: #444;
    }
    .enlace {
      display: inline-block;
      margin-top: 10px;
      color: #0077cc;
      text-decoration: none;
    }
    .enlace:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Últimas noticias de tecnología (con resumen IA)</h1>

  <div id="noticias">
    <p>Cargando noticias...</p>
  </div>

  <script>
    // URLs de tus Workers (ajusta los dominios reales)
    const NEWS_API_URL = "https://newsapiproxy.carlosrojasgomariz.workers.dev/";
    const GEMINI_API_URL = "https://gemini.carlosrojasgomariz.workers.dev/";

    // Carga de noticias desde la proxy de NewsAPI
    async function cargarNoticias() {
      try {
        const response = await fetch(NEWS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoria: "technology" })
        });

        const data = await response.json();
        const contenedor = document.getElementById("noticias");
        contenedor.innerHTML = "";

        const articulos = data.articles?.slice(0, 5) || [];
        if (articulos.length === 0) {
          contenedor.innerHTML = "<p>No se encontraron noticias.</p>";
          return;
        }

        // Mostrar las noticias y luego pedir los resúmenes
        for (const articulo of articulos) {
          const div = document.createElement("div");
          div.className = "noticia";

          const descripcionBase = articulo.description || "Sin descripción disponible.";

          div.innerHTML = `
            ${articulo.urlToImage ? `<img src="${articulo.urlToImage}" alt="Imagen de la noticia">` : ""}
            <div class="titulo">${articulo.title}</div>
            <div class="descripcion">${descripcionBase}</div>
            <div class="resumen"><em>Generando resumen...</em></div>
            <a class="enlace" href="${articulo.url}" target="_blank">Leer más</a>
          `;

          contenedor.appendChild(div);

          // Llamada a Gemini para obtener resumen
          generarResumen(descripcionBase, div.querySelector(".resumen"));
        }

      } catch (error) {
        console.error("Error:", error);
        document.getElementById("noticias").innerHTML = "<p>Error al cargar noticias.</p>";
      }
    }

    // Genera resumen con Gemini
    async function generarResumen(textoOriginal, elementoDestino) {
      try {
        const prompt = `Resume brevemente el siguiente texto de una noticia tecnológica en español, de forma natural y clara:\n\n${textoOriginal}`;

        const body = {
          contents: [{ parts: [{ text: prompt }] }]
        };

        const response = await fetch(GEMINI_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        const resumen = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        elementoDestino.textContent = resumen || "No se pudo generar el resumen.";

      } catch (error) {
        console.error("Error al resumir:", error);
        elementoDestino.textContent = "Error al generar resumen.";
      }
    }

    // Ejecutar al cargar la página
    cargarNoticias();
  </script>
</body>
</html>
