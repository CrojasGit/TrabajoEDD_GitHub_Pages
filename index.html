<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Noticias Tecnología (10 preparadas, 6 visibles)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background:#f4f4f9;
      color:#333;
    }
    h1 { text-align:center; }

    /* === FRASE DEL DÍA === */
    #fraseDia {
      text-align:center;
      background:#fff;
      border-radius:12px;
      padding:15px;
      margin:20px auto;
      max-width:600px;
      box-shadow:0 0 6px rgba(0,0,0,0.1);
      font-style:italic;
    }
    #autorFrase {
      display:block;
      margin-top:8px;
      font-weight:bold;
      color:#555;
    }

    #adminPanel { text-align:center; margin-bottom:20px; }
    #adminButton {
      background:#333; color:#fff; border:none;
      padding:10px 15px; border-radius:8px; cursor:pointer;
    }
    #adminButton:hover { background:#555; }
    #passwordInput { display:none; margin-top:10px; }
    #noticias {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap:20px;
      margin-top:30px;
    }
    .noticia {
      background:#fff;
      padding:15px;
      border-radius:12px;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
      position:relative;
      min-height:180px;
      transition:all 0.3s ease;
    }
    .noticia img {
      max-width:100%;
      border-radius:10px;
      display:block;
      margin-bottom:8px;
    }
    .titulo { font-weight:700; font-size:18px; margin:8px 0; }
    .descripcion { color:#555; }
    .resumen { margin-top:10px; font-style:italic; color:#444; }
    .enlace {
      display:inline-block;
      margin-top:10px;
      color:#0077cc;
      text-decoration:none;
    }
    .enlace:hover { text-decoration:underline; }
    .regenerar-btn {
      display:none;
      position:absolute;
      top:10px;
      right:10px;
      background:orange;
      color:#fff;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <h1>Noticias de Tecnología (con resúmenes IA)</h1>

  <!-- === FRASE DEL DÍA === -->
  <div id="fraseDia">
    <span id="textoFrase">Cargando frase del día...</span>
    <span id="autorFrase"></span>
  </div>

  <div id="adminPanel">
    <button id="adminButton">Modo Admin</button>
    <div id="passwordInput">
      <input type="password" id="adminPass" placeholder="Introduce contraseña" />
      <button id="loginButton">Entrar</button>
    </div>
    <div id="adminStatus"></div>
  </div>

  <div id="noticias">
    <div class="noticia" id="n1"></div>
    <div class="noticia" id="n2"></div>
    <div class="noticia" id="n3"></div>
    <div class="noticia" id="n4"></div>
    <div class="noticia" id="n5"></div>
    <div class="noticia" id="n6" style="display:none"></div>
    <div class="noticia" id="n7" style="display:none"></div>
    <div class="noticia" id="n8" style="display:none"></div>
    <div class="noticia" id="n9" style="display:none"></div>
    <div class="noticia" id="n10" style="display:none"></div>
    <div class="noticia" id="n11" style="display:none"></div>
    <div class="noticia" id="n12" style="display:none"></div>
    <div class="noticia" id="n13" style="display:none"></div>
    <div class="noticia" id="n14" style="display:none"></div>
    <div class="noticia" id="n15" style="display:none"></div>
    <div class="noticia" id="n16" style="display:none"></div>
    <div class="noticia" id="n17" style="display:none"></div>
    <div class="noticia" id="n18" style="display:none"></div>
  </div>

  <script>
    const NEWS_API_URL = "https://newsapiproxy.carlosrojasgomariz.workers.dev/";
    const GEMINI_API_URL = "https://gemini.carlosrojasgomariz.workers.dev/";
    const ADMIN_PASSWORD = "durum2025";

    let noticias = [];
    let esAdmin = false;
    const TOTAL = 18;
    const VISIBLES = 5; // ahora 6 noticias visibles

    // === FRASE DEL DÍA ===
    async function cargarFraseDelDia() {
      try {
        const resp = await fetch("https://api.quotable.io/random");
        const data = await resp.json();
        document.getElementById("textoFrase").textContent = `"${data.content}"`;
        document.getElementById("autorFrase").textContent = `— ${data.author}`;
      } catch (e) {
        document.getElementById("textoFrase").textContent = "No se pudo cargar la frase del día.";
      }
    }

    cargarFraseDelDia();

    // === ADMIN PANEL ===
    const adminButton = document.getElementById("adminButton");
    const passwordDiv = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const adminStatus = document.getElementById("adminStatus");

    adminButton.addEventListener("click", () => {
      passwordDiv.style.display = passwordDiv.style.display === "none" ? "block" : "none";
    });

    loginButton.addEventListener("click", () => {
      const val = document.getElementById("adminPass").value;
      if (val === ADMIN_PASSWORD) {
        esAdmin = true;
        adminStatus.innerHTML = "<span style='color:green'>Modo admin activado ✅</span>";
        document.querySelectorAll(".regenerar-btn").forEach(b => b.style.display = "block");
      } else {
        alert("Contraseña incorrecta");
      }
    });

    // === CARGAR NOTICIAS ===
    async function cargarNoticias() {
      try {
        const response = await fetch(NEWS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoria: "technology", pageSize: TOTAL })
        });
        const data = await response.json();
        noticias = Array.isArray(data.articles) ? data.articles.slice(0, TOTAL) : [];

        if (noticias.length === 0) {
          document.getElementById("noticias").innerHTML = "<p>No hay noticias disponibles.</p>";
          return;
        }

        for (let i = 0; i < TOTAL; i++) {
          const cont = document.getElementById(`n${i + 1}`);
          const art = noticias[i];
          cont.innerHTML = crearPlantillaNoticia(art, i);

          const resumenDiv = cont.querySelector(".resumen");
          generarResumen(getTexto(art), resumenDiv);

          const btn = cont.querySelector(".regenerar-btn");
          btn.addEventListener("click", () => regenerarNoticia(i + 1));
        }
      } catch (err) {
        console.error("Error al cargar noticias:", err);
      }
    }

    function crearPlantillaNoticia(art, index) {
      const img = art.urlToImage ? `<img src="${art.urlToImage}" alt="Imagen">` : "";
      const title = art.title || "Sin título";
      const desc = art.description || art.content || "Sin descripción disponible.";
      return `
        ${img}
        <div class="titulo">${escapeHtml(title)}</div>
        <div class="descripcion">${escapeHtml(desc)}</div>
        <div class="resumen"><em>Generando resumen...</em></div>
        <a class="enlace" href="${art.url}" target="_blank">Leer más</a>
        <button class="regenerar-btn" style="display:none;">Regenerar</button>
      `;
    }

    function getTexto(art) {
      return art.description || art.content || art.title || "";
    }

    async function generarResumen(texto, destino) {
      try {
        if (!texto || texto.trim().length === 0) {
          destino.textContent = "No hay texto para resumir.";
          return;
        }
        const prompt = `Resume brevemente el siguiente texto de una noticia tecnológica en español:\n\n${texto}`;
        const resp = await fetch(GEMINI_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await resp.json();
        const resumen = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        destino.textContent = resumen || "No se pudo generar el resumen.";
      } catch (err) {
        destino.textContent = "Error al generar resumen.";
      }
    }

    function regenerarNoticia(indice) {
      if (!esAdmin) {
        alert("Solo el admin puede regenerar noticias.");
        return;
      }

      const actual = document.getElementById(`n${indice}`);
      if (!actual) return;
      actual.remove();

      for (let i = VISIBLES + 1; i <= TOTAL; i++) {
        const siguiente = document.getElementById(`n${i}`);
        if (siguiente && siguiente.style.display === "none") {
          siguiente.style.display = "block";
          return;
        }
      }

      alert("No hay más noticias para mostrar.");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    cargarNoticias();
  </script>
</body>
</html>
