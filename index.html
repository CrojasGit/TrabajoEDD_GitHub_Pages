<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias de Tecnología - Proxy NewsAPI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #4361ee;
        }

        p {
            color: #7f8c8d;
            font-size: 1rem;
        }

        .news-container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .news-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            flex: 1 1 300px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }

        .news-card:hover {
            transform: translateY(-10px);
        }

        .news-image {
            height: 200px;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 1rem;
        }

        .news-image img {
            width: 100%;
            object-fit: cover;
        }

        .news-content {
            flex: 1;
        }

        .news-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .news-source {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 0.5rem;
            text-align: right;
        }

        a {
            color: #4361ee;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Noticias de Tecnología</h1>
        <p>Las últimas noticias del mundo tecnológico, traídas a ti por nuestra proxy NewsAPI.</p>
    </header>

    <div class="news-container" id="newsContainer">
        <!-- Aquí se cargarán las noticias -->
    </div>

    <script src="/proxy.js"></script>
</body>
</html>
