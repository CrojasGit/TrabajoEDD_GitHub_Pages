<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Noticias Tecnología (admin swap - mostrar pool oculto)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background:#f4f4f9; color:#333; }
    h1 { text-align:center; }
    #adminPanel { text-align:center; margin-bottom:20px; }
    #adminButton { background:#333; color:#fff; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; }
    #adminButton:hover { background:#555; }
    #passwordInput { display:none; margin-top:10px; }
    #noticias {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap:20px;
      margin-top:30px;
    }
    .noticia {
      background:#fff; padding:15px; border-radius:12px; box-shadow:0 0 8px rgba(0,0,0,0.1);
      position:relative; min-height:170px;
    }
    .noticia.hidden { display:none; }
    .noticia.removed { display:none !important; opacity:0.3; }
    .noticia img { max-width:100%; border-radius:10px; display:block; margin-bottom:8px; }
    .titulo { font-weight:700; font-size:18px; margin:8px 0; }
    .descripcion { color:#555; }
    .resumen { margin-top:10px; font-style:italic; color:#444; }
    .enlace { display:inline-block; margin-top:10px; color:#0077cc; text-decoration:none; }
    .enlace:hover { text-decoration:underline; }
    .regenerar-btn {
      display:none;
      position:absolute; top:10px; right:10px;
      background:orange; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;
    }
    .badge { position:absolute; left:10px; top:10px; background:#222; color:#fff; padding:4px 8px; border-radius:6px; font-size:12px; }
    #adminStatus { margin-top:8px; }
  </style>
</head>
<body>
  <h1>Últimas noticias de tecnología (con resúmenes IA)</h1>

  <div id="adminPanel">
    <button id="adminButton">Modo Admin</button>
    <div id="passwordInput">
      <input type="password" id="adminPass" placeholder="Introduce contraseña">
      <button id="loginButton">Entrar</button>
    </div>
    <div id="adminStatus"></div>
  </div>

  <div id="noticias">
    <p>Cargando noticias...</p>
  </div>

  <script>
    // ====== CONFIG ======
    const NEWS_API_URL = "https://newsapiproxy.carlosrojasgomariz.workers.dev/";
    const GEMINI_API_URL = "https://gemini.carlosrojasgomariz.workers.dev/";
    const ADMIN_PASSWORD = "durum2025"; // contraseña en texto plano (temporal)

    // ====== ESTADO ======
    let noticiasPool = [];         // array con objetos de noticias (pool)
    let poolElements = [];         // array con elementos DOM creados para cada noticia del pool
    let esAdmin = false;
    const MAX_VISIBLE = 5;         // número de tarjetas visibles simultáneamente
    const MAX_POOL = 10;           // tamaño máximo del pool que pedimos

    // ====== DOM ======
    const adminButton = document.getElementById("adminButton");
    const passwordDiv = document.getElementById("passwordInput");
    const loginButton = document.getElementById("loginButton");
    const adminStatus = document.getElementById("adminStatus");
    const noticiasCont = document.getElementById("noticias");

    // ====== ADMIN UI ======
    adminButton.addEventListener("click", () => {
      passwordDiv.style.display = passwordDiv.style.display === "none" ? "block" : "none";
    });

    loginButton.addEventListener("click", () => {
      const v = document.getElementById("adminPass").value;
      if (v === ADMIN_PASSWORD) {
        esAdmin = true;
        adminStatus.innerHTML = "<span style='color:green'>Admin activo ✅</span>";
        // mostrar botones regenerar
        document.querySelectorAll(".regenerar-btn").forEach(b => b.style.display = "block");
      } else {
        alert("Contraseña incorrecta");
      }
    });

    // ====== FETCH: obtener pool de noticias (hasta 10) ======
    async function fetchNoticiasPool() {
      noticiasCont.innerHTML = "<p>Cargando noticias...</p>";
      try {
        const response = await fetch(NEWS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoria: "technology", pageSize: MAX_POOL })
        });
        const data = await response.json();
        noticiasPool = Array.isArray(data.articles) ? data.articles.slice(0, MAX_POOL) : [];

        if (noticiasPool.length === 0) {
          noticiasCont.innerHTML = "<p>No se encontraron noticias (pool vacío).</p>";
          return;
        }

        buildAllPoolElements();
        renderInitialVisible();
      } catch (err) {
        console.error("Error al cargar pool:", err);
        noticiasCont.innerHTML = "<p>Error al cargar noticias.</p>";
      }
    }

    // ====== Construir elemento DOM para cada noticia del pool y mantenerlo en poolElements ======
    function buildAllPoolElements() {
      poolElements = noticiasPool.map((art, idx) => {
        const div = document.createElement("div");
        div.className = "noticia";
        div.dataset.poolIndex = String(idx);
        div.dataset.removed = "false"; // marca si fue eliminada por regenerar
        // Badge (opcional, muestra posición en pool)
        const badgeHtml = `<div class="badge">#${idx + 1} / ${noticiasPool.length}</div>`;
        const imgHtml = art.urlToImage ? `<img src="${art.urlToImage}" alt="Imagen noticia">` : "";
        const desc = art.description || art.content || "Sin descripción disponible.";
        div.innerHTML = `
          ${badgeHtml}
          ${imgHtml}
          <div class="titulo">${escapeHtml(art.title || "Sin título")}</div>
          <div class="descripcion">${escapeHtml(desc)}</div>
          <div class="resumen"><em>Generando resumen...</em></div>
          <a class="enlace" href="${art.url || '#'}" target="_blank">Leer más</a>
          <button class="regenerar-btn">Regenerar</button>
        `;
        // listener del botón regenerar (usa cierre para saber poolIndex)
        const btn = div.querySelector(".regenerar-btn");
        btn.addEventListener("click", () => handleRegenerarOnVisible(idx));
        // si no es admin, botones ocultos
        if (!esAdmin) btn.style.display = "none";
        // generamos el resumen (aunque algunos estarán ocultos)
        const resumenDiv = div.querySelector(".resumen");
        generarResumen(getTextoParaResumen(art), resumenDiv);
        return div;
      });
    }

    // ====== Render inicial: insertar en DOM solo las 5 primeras visibles; las demás añadimos pero ocultas ======
    function renderInitialVisible() {
      noticiasCont.innerHTML = "";
      const total = poolElements.length;
      // Si hay menos del MAX_VISIBLE, mostrar las que haya
      const visibles = Math.min(MAX_VISIBLE, total);

      // Insertamos visibles (primeros visibles)
      for (let i = 0; i < visibles; i++) {
        const el = poolElements[i];
        el.classList.remove("hidden");
        noticiasCont.appendChild(el);
      }
      // Insertamos el resto pero con clase hidden (para poder activarlas luego)
      for (let i = visibles; i < total; i++) {
        const el = poolElements[i];
        el.classList.add("hidden");
        // las añadimos al final del contenedor (pero ocultas)
        noticiasCont.appendChild(el);
      }
    }

    // ====== Obtener texto para resumir ======
    function getTextoParaResumen(art) {
      if (!art) return "";
      return art.description || art.content || art.title || "";
    }

    // ====== Manejar click Regenerar (en una tarjeta visible) ======
    // La función recibe poolIndex del botón clicado (poolIndex del artículo que actualmente está visible).
    function handleRegenerarOnVisible(clickedPoolIndex) {
      if (!esAdmin) { alert("Solo el admin puede regenerar."); return; }

      // 1) localizar el elemento DOM actual del poolIndex que está visible
      const currentEl = poolElements.find(el => Number(el.dataset.poolIndex) === clickedPoolIndex);
      if (!currentEl) {
        console.warn("Elemento visible no encontrado para poolIndex", clickedPoolIndex);
        return;
      }

      // 2) marcarlo como eliminado y quitar del DOM
      currentEl.dataset.removed = "true";
      currentEl.classList.add("removed");
      currentEl.remove(); // lo quitamos del DOM (ya no estará disponible para reactivarse)

      // 3) buscar la primera noticia "desactivada" (hidden) que NO esté marcada como removed
      const nextHidden = poolElements.find(el => el.dataset.removed === "false" && el.classList.contains("hidden"));
      if (!nextHidden) {
        alert("No hay más noticias desactivadas disponibles para activar.");
        return;
      }

      // 4) activar esa noticia: quitar clase hidden y moverla a la posición donde estaba la eliminada
      nextHidden.classList.remove("hidden");
      // inserción: queremos que ocupe la posición visual del elemento eliminado.
      // Calculamos índice de posición en grid igual al índice del elemento eliminado en el contenedor (si fuera posible).
      // Como hemos eliminado currentEl, tomamos la posición de inserción como el índice del primer elemento posterior.
      // Para simplificar y garantizar orden, insertamos nextHidden en la misma posición en la que se encontraba currentEl:
      // buscamos el número de elementos visibles actuales y la posición en el DOM donde debe ir.
      // Insertarlo en el lugar correcto: vamos a posicionarlo en la primera posición vacante en las visibles.
      // Implementación práctica: insertar nextHidden en la posición correspondiente al número de hijos del contenedor hasta el lugar del removed.
      // Para encontrar esa "posición", usaremos la posición del removed en el pool original.
      const removedPoolIndex = Number(clickedPoolIndex);
      // calculamos cuántos visibles hay ahora (tras la eliminación)
      const visiblesAhora = Array.from(noticiasCont.children).filter(ch => !ch.classList.contains("hidden") && ch.dataset && ch.dataset.poolIndex !== undefined).length;
      // Si hay menos de MAX_VISIBLE visibles, insertamos nextHidden al final de las visibles:
      // buscar primer hijo que esté oculto o el final
      // Buscamos el primer hijo que tenga clase hidden: lo reemplazamos por nextHidden. Si no hay, insertamos al final.
      const hijos = Array.from(noticiasCont.children);
      let inserted = false;
      for (let i = 0; i < hijos.length; i++) {
        if (hijos[i].classList && hijos[i].classList.contains("hidden")) {
          noticiasCont.insertBefore(nextHidden, hijos[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        noticiasCont.appendChild(nextHidden);
      }

      // 5) mostrar botón regenerar en el nuevo elemento si admin
      const btn = nextHidden.querySelector(".regenerar-btn");
      if (btn) btn.style.display = esAdmin ? "block" : "none";

      // 6) (opcional) actualizar badges para claridad (posición pool)
      actualizarBadges();

      // ya está: nextHidden fue activado en lugar del eliminado
    }

    // ====== Actualizar contenido de badges según poolElements orden real ======
    function actualizarBadges() {
      poolElements.forEach((el, idx) => {
        const b = el.querySelector(".badge");
        if (b) b.textContent = `#${idx + 1} / ${poolElements.length}`;
      });
    }

    // ====== Generar resumen usando proxy Gemini ======
    async function generarResumen(textoOriginal, elementoDestino) {
      try {
        if (!textoOriginal || textoOriginal.trim().length === 0) {
          elementoDestino.textContent = "No hay texto para resumir.";
          return;
        }
        const prompt = `Resume brevemente el siguiente texto de una noticia tecnológica en español, de forma natural y clara:\n\n${textoOriginal}`;
        const body = { contents: [{ parts: [{ text: prompt }] }] };

        const resp = await fetch(GEMINI_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await resp.json();
        const resumen = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        elementoDestino.textContent = resumen || "No se pudo generar el resumen.";
      } catch (err) {
        console.error("Error generarResumen:", err);
        elementoDestino.textContent = "Error al generar resumen.";
      }
    }

    // ====== Util: escapar HTML para títulos/descr ======
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // ====== INICIO ======
    fetchNoticiasPool();
  </script>
</body>
</html>
