<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resumen de Noticias de Tecnología con Google AI Studio</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .news-item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    h1 { color: #3366ff; }
  </style>
</head>
<body>

  <h1>Resumen de Noticias de Tecnología</h1>

  <div id="noticias-container">
    <!-- Aquí se insertarán las noticias -->
  </div>

  <script>
    // API Key de NewsAPI (en texto plano como solicitado)
    const apiKey = 'd74e0743639744d0b7450bf784a0fbdc';

    async function obtenerNoticias() {
      try {
        const response = await fetch(`https://newsapi.org/v2/everything?q=tecnologia&language=es&sortBy=publishedAt&pageSize=5&apiKey=${apiKey}`);
        const data = await response.json();

        if (data.status !== 'ok') {
          throw new Error('Error al obtener noticias');
        }

        return data.articles;
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('noticias-container').innerHTML = '<p>No se pudo cargar las noticias.</p>';
        return [];
      }
    }

    async function generarResumenNoticia(article) {
      // URL del Worker de Cloudflare (proxy seguro para Gemini)
      const API_URL = "https://gemini.carlosrojasgomariz.workers.dev/";

      try {
        const prompt = `Escribe un resumen conciso de la siguiente noticia: ${article.title} - ${article.description || ''}. Limita el resumen a 100 palabras.`;

        const requestBody = {
          contents: [{ parts: [{ text: prompt }] }],
        };

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(requestBody),
        });

        const data = await response.json();
        const resumen = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No se pudo generar el resumen.';

        return {
          titulo: article.title,
          resumen: resumen,
          url: article.url,
        };
      } catch (error) {
        console.error('Error al generar resumen:', error);
        return {
          titulo: article.title,
          resumen: 'No se pudo generar el resumen de esta noticia.',
          url: '',
        };
      }
    }

    async function mostrarNoticias() {
      const noticias = await obtenerNoticias();
      const noticiasContainer = document.getElementById('noticias-container');

      if (noticias && noticias.length > 0) {
        // Crear un array para almacenar las promesas de los resúmenes
        const resumenPromises = noticias.map(async (article) => await generarResumenNoticia(article));

        // Esperar a que todas las promesas se cumplan
        const resumenesFinales = await Promise.all(resumenPromises);

        // Insertar cada noticia en el contenedor
        resumenesFinales.forEach((noticia) => {
          const divNoticia = document.createElement('div');
          divNoticia.classList.add('news-item');

          const tituloElement = document.createElement('h3');
          tituloElement.innerHTML = `<a href="${noticia.url}" target="_blank">${noticia.titulo}</a>`;

          const resumenElement = document.createElement('p');
          resumenElement.textContent = noticia.resumen;

          divNoticia.appendChild(tituloElement);
          divNoticia.appendChild(resumenElement);

          noticiasContainer.appendChild(divNoticia);
        });
      } else {
        noticiasContainer.innerHTML = '<p>No se encontraron noticias de tecnología.</p>';
      }
    }

    // Mostrar las noticias al cargar la página
    window.onload = mostrarNoticias;
  </script>
</body>
</html>
