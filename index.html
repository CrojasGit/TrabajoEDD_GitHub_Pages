<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noticias de Tecnología</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    #noticias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .noticia {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    .noticia img {
      max-width: 100%;
      border-radius: 10px;
    }
    .titulo {
      font-weight: bold;
      font-size: 18px;
      margin: 10px 0;
    }
    .descripcion {
      color: #555;
    }
    .enlace {
      display: inline-block;
      margin-top: 10px;
      color: #0077cc;
      text-decoration: none;
    }
    .enlace:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Últimas noticias de tecnología</h1>

  <div id="noticias">
    <p>Cargando noticias...</p>
  </div>

  <script>
    // URL del Worker de Cloudflare (proxy)
    const API_URL = "https://newsapiproxy.carlosrojasgomariz.workers.dev/";

    async function cargarNoticias() {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ categoria: "technology" })
        });

        const data = await response.json();
        console.log("Respuesta NewsAPI:", data);

        const contenedor = document.getElementById("noticias");
        contenedor.innerHTML = "";

        const articulos = data.articles?.slice(0, 5) || [];

        if (articulos.length === 0) {
          contenedor.innerHTML = "<p>No se encontraron noticias.</p>";
          return;
        }

        articulos.forEach((articulo) => {
          const div = document.createElement("div");
          div.className = "noticia";

          div.innerHTML = `
            ${articulo.urlToImage ? `<img src="${articulo.urlToImage}" alt="Imagen de la noticia">` : ""}
            <div class="titulo">${articulo.title}</div>
            <div class="descripcion">${articulo.description || "Sin descripción disponible."}</div>
            <a class="enlace" href="${articulo.url}" target="_blank">Leer más</a>
          `;

          contenedor.appendChild(div);
        });

      } catch (error) {
        console.error("Error:", error);
        document.getElementById("noticias").innerHTML = "<p>Error al cargar noticias.</p>";
      }
    }

    // Ejecutar al cargar la página
    cargarNoticias();
  </script>
</body>
</html>
