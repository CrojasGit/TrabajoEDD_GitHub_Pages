<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resúmenes de Noticias Tecnológicas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
    }
    .noticia {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      border: none;
      background: #0078ff;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005fcc;
    }
  </style>
</head>
<body>

  <h1>Top 5 Noticias de Tecnología (Resumen)</h1>
  <button id="obtenerNoticias">Obtener Resúmenes</button>

  <div id="contenedorNoticias"></div>

  <script>
    const PROXY_URL = "https://newsapiproxy.carlosrojasgomariz.workers.dev/";

    document.getElementById("obtenerNoticias").addEventListener("click", async () => {
      const contenedor = document.getElementById("contenedorNoticias");
      contenedor.innerHTML = "<p>Cargando noticias...</p>";

      try {
        const noticiasResp = await fetch(PROXY_URL);
        const noticiasData = await noticiasResp.json();
        const noticias = noticiasData.articles?.slice(0, 5) || [];

        if (noticias.length === 0) {
          contenedor.innerHTML = "<p>No se encontraron noticias o hubo un error.</p>";
          return;
        }

        contenedor.innerHTML = "";
        noticias.forEach((noticia, idx) => {
          const p = document.createElement("p");
          p.className = "noticia";
          p.innerHTML = `<strong>${idx + 1}. <a href="${noticia.url}" target="_blank">${noticia.title}</a></strong><br>${noticia.description || "No hay descripción disponible."}`;
          contenedor.appendChild(p);
        });

      } catch (error) {
        contenedor.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
      }
    });
  </script>

</body>
</html>
