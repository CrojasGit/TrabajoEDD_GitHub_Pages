<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias de Tecnología</title>
    <!-- Agrega aquí tu CSS si lo tienes -->
    <style>
        /* Estilos básicos para la página */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
        }
        .news-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .news-item {
            width: calc(33% - 20px);
            border: 1px solid #ddd;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .news-item img {
            width: 100%;
            height: auto;
            margin-bottom: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Últimas Noticias de Tecnología</h1>
    <div class="news-container" id="newsContainer">
        <!-- Aquí se insertarán las noticias -->
    </div>
    
    <script>
        // Script para cargar las noticias desde Cloudflare Workers
        async function loadNews() {
            try {
                const response = await fetch('/api/get-tech-news'); // Endpoint de la API en Cloudflare
                if (response.ok) {
                    const data = await response.json();
                    const newsContainer = document.getElementById('newsContainer');
                    
                    // Limitar a las 5 primeras noticias
                    const limitedNews = data.slice(0, 5);
                    
                    limitedNews.forEach(item => {
                        const newsItem = document.createElement('div');
                        newsItem.classList.add('news-item');
                        
                        // Crear elemento de imagen
                        let img = document.createElement('img');
                        img.src = item.imageUrl; // Suponiendo que la API devuelve imageUrl
                        img.alt = item.title;
                        newsItem.appendChild(img);
                        
                        // Crear título
                        let title = document.createElement('h2');
                        title.textContent = item.title;
                        newsItem.appendChild(title);
                        
                        // Crear párrafo
                        let paragraph = document.createElement('p');
                        paragraph.textContent = item.description; // Suponiendo que la API devuelve description
                        newsItem.appendChild(paragraph);
                        
                        newsContainer.appendChild(newsItem);
                    });
                } else {
                    console.error('Error al cargar las noticias:', response.status, response.statusText);
                    const newsContainer = document.getElementById('newsContainer');
                    newsContainer.innerHTML = '<p>No se pudo cargar las noticias en este momento.</p>';
                }
            } catch (error) {
                console.error('Error al obtener las noticias:', error);
                const newsContainer = document.getElementById('newsContainer');
                newsContainer.innerHTML = `<p>Ocurrió un error al obtener las noticias: ${error}</p>`;
            }
        }
        
        // Cargar noticias cuando se carga la página
        window.addEventListener('load', loadNews);
    </script>
</body>
</html>
