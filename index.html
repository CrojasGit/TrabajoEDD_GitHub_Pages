<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IA Newsroom - Noticias de Tecnología</title>

  <!-- Fuente como en index.html -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --color-negro:#0b0b10;
      --color-azul-oscuro:#151459;
      --color-fondo-texto:#1d2b52;
      --color-footer:#050505;
      --color-texto-principal:#ffffff;
      --accent-admin:#410074;
      --font-telegraf:'Roboto',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      font-family:var(--font-telegraf);
      color:var(--color-texto-principal);
      background-color:var(--color-negro);
      scroll-snap-type:y mandatory;
      overflow-x:hidden;
    }

    /* ===== Banner principal (hero) ===== */
    .seccion{
      height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:50px;
      position:relative;overflow:hidden;
      scroll-snap-align:start;
    }
    .banner{
      background-image:url('assets/img/Fondo Banner.png');
      background-size:cover;background-position:center;background-repeat:no-repeat;
      text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;
    }
    .overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:1;}

    /* Header superior dentro del banner */
    .banner-header{
      position:absolute; top:18px; left:0; right:0;
      width:100%; padding:0 16px;
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px;
      z-index:3;
    }
    .left-cluster{display:flex; gap:12px; align-items:center; justify-self:start;}
    .badge{
      background:var(--accent-admin); color:#fff; font-weight:800; letter-spacing:.5px;
      border:2px solid rgba(255,255,255,.35);
      padding:12px 18px; border-radius:14px; display:inline-flex; align-items:center; gap:10px;
      font-size:14px; box-shadow:0 6px 18px rgba(0,0,0,.25);
    }
    #adminButton{
      background:var(--accent-admin);
      color:#fff; font-weight:900; text-transform:uppercase;
      padding:12px 18px; border-radius:14px; border:2px solid rgba(255,255,255,.35);
      box-shadow:0 6px 18px rgba(0,0,0,.25); font-size:14px; cursor:pointer;
    }
    #passwordInput{ display:none; position:absolute; top:64px; left:16px; z-index:3; }
    #passwordInput input{
      padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.35); background:#111; color:#fff;
      margin-right:6px;
    }
    #loginButton{
      background:#0ea5e9; border:none; color:#fff; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:700;
    }
    #adminStatus{ position:absolute; top:64px; right:16px; z-index:3; font-weight:700; }

    .brand{ text-align:center; line-height:1.05; justify-self:center; z-index:3; }
    .brand h1{ font-size:40px; letter-spacing:2px; font-weight:900; }
    .brand p{ font-size:18px; opacity:.9; font-weight:700; margin-top:2px; }

    .navnums{display:flex; gap:10px; justify-self:end;}
    .navbtn{
      width:46px; height:46px; border-radius:999px; display:grid; place-items:center;
      border:2px solid #fff; background:rgba(21,20,89,.55);
      font-weight:900; font-size:18px; color:#fff; text-decoration:none;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    .banner-contenido{ position:relative; z-index:2; padding-top:110px; }

    /* Frase del día */
    .frase-del-dia{
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      background-color:rgba(0,0,0,.35);
      border:2px solid rgba(255,255,255,.45);
      border-radius:16px;
      width:min(900px,92vw);
      min-height:160px;
      padding:26px 34px; margin:16px auto 0;
      display:flex; flex-direction:column; gap:10px; justify-content:center; align-items:center;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }
    .frase-header{
      display:flex; align-items:center; gap:12px; font-weight:900; letter-spacing:1px;
      font-size:22px; text-transform:uppercase;
    }
    .icono-chip{ width:28px; height:28px; }
    #textoFrase{ font-style:italic; font-size:18px; text-align:center; opacity:.95; }
    #autorFrase{ font-size:14px; opacity:.85; }

    /* ===== Noticias a pantalla completa ===== */
    #noticias{ /* solo contenedor lógico, sin grid */ }
    .noticia{
      height:100vh; padding:50px; position:relative; overflow:hidden;
      display:grid; grid-template-rows:auto 1fr; gap:24px;
      scroll-snap-align:start;
    }
    /* Alternar fondos tipo index.html */
    .noticia:nth-child(odd){ background:linear-gradient(to bottom,var(--color-negro),var(--color-azul-oscuro)); }
    .noticia:nth-child(even){ background:linear-gradient(to bottom,var(--color-azul-oscuro),var(--color-negro)); }

    /* Título de cada noticia (estilo cabecera con icono ratón) */
    .noticia-titulo{
      display:flex; align-items:center; justify-content:center; gap:12px;
      margin-top:10px; font-size:32px; font-weight:900;
      text-transform:uppercase;
    }
    .icono-noticia{ width:32px; height:32px; }

    /* Cuerpo de cada noticia en dos columnas (imagen / texto) */
    .noticia-contenido{
      width:min(1200px,88vw); margin:0 auto;
      display:grid; grid-template-columns:1fr 1fr; gap:32px;
      align-items:stretch;
    }

    /* Columna de imagen: el <img> que inyecta el JS */
    .noticia img{
      width:100%; height:100%; object-fit:cover;
      border:2px solid #000; border-radius:14px;
      background:transparent; box-shadow:none;
      min-height:260px;
    }

    /* Columna de texto: “simular” una sola tarjeta
       Apilamos .titulo, .descripcion, .resumen, .enlace sin huecos visibles */
    .texto-col{ display:flex; flex-direction:column; gap:0; }
    .titulo, .descripcion, .resumen, .enlace{
      background:var(--color-fondo-texto);
      border-left:1.5px solid rgba(0,0,0,.45);
      border-right:1.5px solid rgba(0,0,0,.45);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      padding:16px 18px; margin:0; display:block;
    }
    /* bordes y radios para que parezca UNA sola caja */
    .titulo{ border-top:1.5px solid rgba(0,0,0,.45); border-top-left-radius:14px; border-top-right-radius:14px; font-weight:900; font-size:20px; }
    .descripcion{ opacity:.95; }
    .resumen{ font-style:italic; opacity:.95; }
    .enlace{
      border-bottom:1.5px solid rgba(0,0,0,.45);
      border-bottom-left-radius:14px; border-bottom-right-radius:14px;
      text-decoration:none; color:#fff; font-weight:800; text-transform:uppercase;
      text-align:center;
    }

    /* Cuando no hay imagen, que la columna de texto ocupe todo */
    .noticia:not(:has(img)) .noticia-contenido{ grid-template-columns:1fr; }

    /* Botón admin de regenerar (lo muestra el JS en modo admin) */
    .regenerar-btn{
      display:none; position:absolute; top:16px; right:16px;
      background:orange; color:#111; border:none; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:900;
    }

    /* ===== Footer con navegación ===== */
    .footer{
      width:100%; background-color:rgba(5,5,5,.74); padding:18px 16px; font-size:.9em;
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
      position:fixed; bottom:0; z-index:10; gap:10px;
    }
    .footer-left{ justify-self:start; display:flex; flex-direction:column; gap:2px; }
    .footer-left a{ color:#fff; text-decoration:none; font-weight:700; }
    .footer-center a{ color:#fff; text-decoration:none; font-weight:900; text-transform:uppercase; font-size:18px; }
    .footer-right{ justify-self:end; display:flex; align-items:center; gap:10px; }
    .footbtn{
      width:42px; height:42px; border-radius:999px; display:grid; place-items:center;
      border:2px solid #fff; background:rgba(21,20,89,.55); color:#fff; font-weight:900; font-size:16px; text-decoration:none;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
    }

    @media (max-width:900px){
      .brand h1{ font-size:30px; }
      .brand p{ font-size:14px; }
      .navbtn{ width:42px; height:42px; font-size:16px; }
      .noticia-contenido{ grid-template-columns:1fr; }
      .noticia-titulo{ font-size:26px; }
      .icono-noticia{ width:26px; height:26px; }
    }

    /* ==== NUEVO CSS añadido ==== */
    .noticia-contenido{
      width:min(1200px,88vw);
      margin:0 auto;
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap:32px;
      align-items:stretch;
      position:relative;
    }
    .noticia-contenido::before{
      content:"";
      position:absolute;
      inset:0;
      right:calc(50% - 16px);
      background:#1f2937;
      border-radius:14px;
      border:1.5px solid rgba(0,0,0,.45);
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      z-index:0;
    }
    .noticia :is(.titulo,.descripcion,.resumen,.enlace){
      grid-column:1;
      position:relative; z-index:1;
      background:transparent;
      border:none; box-shadow:none; margin:0; padding:0;
    }
    .noticia .titulo{
      font-weight:900; font-size:22px; line-height:1.2; margin-bottom:10px;
    }
    .noticia .descripcion{ margin-bottom:10px; opacity:.95; }
    .noticia .resumen{ font-style:italic; margin-bottom:16px; opacity:.95; }
    .noticia .enlace{
      display:inline-block; text-decoration:none; color:#fff; font-weight:800;
      text-transform:uppercase; padding:10px 14px; border:2px solid #fff; border-radius:10px;
    }
    .noticia img{
      grid-column:2;
      width:100%; height:100%;
      object-fit:cover;
      border:2px solid #000;
      border-radius:14px;
      background:transparent; box-shadow:none;
      min-height:260px;
    }
    .noticia:not(:has(img)) .noticia-contenido{
      grid-template-columns:1fr;
    }
    .noticia:not(:has(img)) .noticia-contenido::before{
      right:0;
    }
    .noticia-titulo{
      display:flex; align-items:center; justify-content:center; gap:12px;
      margin-top:10px; font-size:32px; font-weight:900; text-transform:uppercase; letter-spacing:.5px;
    }
    .icono-noticia{ width:32px; height:32px; }
    @media (max-width:900px){
      .noticia-contenido{ grid-template-columns:1fr; gap:18px; }
      .noticia-contenido::before{ right:0; }
      .noticia img{ grid-column:1; height:42vh; }
      .noticia-titulo{ font-size:26px; }
      .icono-noticia{ width:26px; height:26px; }
    }
  </style>
</head>
