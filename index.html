<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noticias de Tecnología</title>
  <style>
	#noticias {
	  display: flex;
	  justify-content: space-around;
	  flex-wrap: wrap;
	}
	.noticia {
	  border: 1px solid #ddd;
	  padding: 10px;
	  width: 300px;
	  margin-right: 20px;
	  box-shadow: 0 0 5px lightgray;
	}
	.noticia h3 {
	  font-size: 1.5em;
	}
	.noticia img {
	  max-width: 100%;
	  height: auto;
	  border-radius: 5px;
	}
	.noticia p {
	  text-align: justify;
	}
	a {
	  display: block;
	  margin-top: 10px;
	  color: #4a90e2;
	  text-decoration: none;
	  font-weight: bold;
	}
	a:hover {
	  text-decoration: underline;
	}
  </style>
</head>
<body>
  <h1>Noticias de Tecnología</h1>
  <button onclick="getNews()">Cargar Noticias</button>
  <div id="noticias"></div>

  <script>
	const API_URL = "https://your-cloudflare-worker-url.workers.dev/";
	
	function getNews() {
	  fetch(API_URL, {
		method: 'POST',
		headers: {
		  'Content-Type': 'application/json'
		},
		body: JSON.stringify({})  // Empty body
	  })
		.then(response => response.json())
		.then(data => displayNews(data))
		.catch(error => console.error('Error:', error));
	}
	
	function displayNews(data) {
	  const newsContainer = document.getElementById('noticias');
	  newsContainer.innerHTML = '<h2>Loading...</h2>';
	  if (!data || data.status === 'error') {
		newsContainer.innerHTML = '<p>Error al cargar noticias. Inténtalo de nuevo.</p>';
		return;
	  }
	  // Check if there are at least 5 articles
	  const articles = data.articles || [];
	  if (articles.length < 1) {
		newsContainer.innerHTML = '<p>No hay noticias disponibles en este momento.</p>';
		return;
	  }
	  newsContainer.innerHTML = '';
	  for (let i = 0; i < Math.min(5, articles.length); i++) {
		const article = articles[i];
		const div = document.createElement('div');
		div.className = 'noticia';
		div.innerHTML = `
		  <h3>${article.title}</h3>
		  ${article.urlToImage ? `<img src="${article.urlToImage}" alt="${article.title}">` : ''}
		  <p>${article.description}</p>
		  <a href="${article.url}" target="_blank">Leer más →</a>
		`;
		newsContainer.appendChild(div);
	  }
	}
  </script>
</body>
</html>
