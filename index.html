<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Newsroom - Noticias de Tecnología</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
:root{
  --color-negro:#0b0b10;
  --color-azul-oscuro:#151459;
  --color-fondo-texto:#1d2b52;
  --color-footer:#050505;
  --color-texto-principal:#ffffff;
  --accent-admin:#410074;
  --font-telegraf:'Roboto',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-telegraf);
  color:var(--color-texto-principal);
  background-color:var(--color-negro);
  scroll-snap-type:y mandatory;
}

/* ===== SECCIONES ===== */
.seccion-noticia{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:50px;
  scroll-snap-align:start;
  position:relative;
  overflow:hidden;
}

/* ===== BANNER PRINCIPAL ===== */
.banner{
  background-image:url('assets/img/Fondo Banner.png');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.overlay{position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:1;}

.banner-header{
  position:absolute;
  top:18px;
  left:0;
  right:0;
  width:100%;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:18px;
  z-index:3;
}
.badge{ 
  background:var(--accent-admin);
  color:#fff;
  font-weight:800;
  letter-spacing:.5px;
  border:2px solid rgba(255,255,255,.35);
  padding:12px 18px;
  border-radius:14px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.admin-btn,#adminButton{
  background:var(--accent-admin);
  color:#fff;
  font-weight:900;
  text-transform:uppercase;
  padding:12px 18px;
  border-radius:14px;
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
  font-size:14px;
  cursor:pointer;
}
.left-cluster{display:flex; gap:12px; align-items:center; justify-self:start;}
.brand{text-align:center; line-height:1.05; justify-self:center;}
.brand h1{ font-size:40px; letter-spacing:2px; font-weight:900; }
.brand p{ font-size:18px; opacity:.9; font-weight:700; margin-top:2px; }

.navnums{display:flex; gap:10px; justify-self:end;}
.navbtn{
  width:46px;
  height:46px;
  border-radius:999px;
  display:grid;
  place-items:center;
  border:2px solid #fff;
  background:rgba(21,20,89,.55);
  font-weight:900;
  font-size:18px;
  color:#fff;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.banner-contenido{ position:relative; z-index:2; padding-top:110px; }

/* ===== FRASE DEL DÍA ===== */
.frase-del-dia{
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  background-color:rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.45);
  border-radius:16px;
  width:min(900px,92vw);
  min-height:260px;
  padding:34px 42px;
  margin:26px auto 0;
  display:flex;
  flex-direction:column;
  gap:16px;
  justify-content:center;
  align-items:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.frase-header{
  display:flex;
  align-items:center;
  gap:14px;
  font-weight:900;
  letter-spacing:1px;
  font-size:24px;
  text-transform:uppercase;
  margin-top:-8px;
}
.icono-chip{ width:32px; height:32px; }
#textoFrase{ font-style:italic; font-size:18px; text-align:center; opacity:.95; }
#autorFrase{ margin-top:8px; opacity:.8; }

/* ===== FONDOS DE NOTICIAS ===== */
.noticia:nth-child(odd){background:linear-gradient(to bottom,var(--color-negro),var(--color-azul-oscuro));}
.noticia:nth-child(even){background:linear-gradient(to bottom,var(--color-azul-oscuro),var(--color-negro));}

/* ===== NOTICIAS ===== */
.noticia-contenido{
  display:flex;
  align-items:stretch;
  justify-content:space-between;
  gap:40px;
  width:min(1200px,90%);
  margin:0 auto;
  padding:30px 0;
}

.noticia-img{
  flex:1 1 40%;
  display:flex;
  justify-content:center;
  align-items:center;
}
.noticia-img img{
  width:100%;
  height:auto;
  max-height:420px;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.2);
  object-fit:cover;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.noticia-texto{
  flex:1 1 60%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
  background-color:rgba(255,255,255,0.05);
  padding:26px;
  border-radius:14px;
  border:1.5px solid rgba(0,0,0,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.noticia-texto .titulo{
  font-weight:900;
  font-size:22px;
  line-height:1.2;
  margin-bottom:10px;
  color:#fff;
}
.noticia-texto .descripcion{
  margin-bottom:10px;
  opacity:.95;
  color:#fff;
}
.noticia-texto .resumen{
  font-style:italic;
  margin-bottom:16px;
  opacity:.9;
  color:#fff;
}
.noticia-texto .enlace{
  display:inline-block;
  text-decoration:none;
  color:#fff;
  font-weight:800;
  text-transform:uppercase;
  padding:10px 14px;
  border:2px solid #fff;
  border-radius:10px;
  width:fit-content;
}
.regenerar-btn{
  display:none;
  position:absolute;
  top:16px;
  right:16px;
  background:orange;
  color:#111;
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:900;
}

/* ===== TÍTULOS ===== */
.noticia-titulo-wrapper{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:10px;
  margin-top:20px;
}
.noticia-titulo-wrapper h2{
  font-size:36px;
  display:flex;
  align-items:center;
  gap:12px;
}
.icono-noticia{ width:36px; height:36px; }

/* ===== FOOTER ===== */
.footer{
  width:100%;
  background-color:rgba(5,5,5,.74);
  padding:18px 16px;
  font-size:.9em;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  position:fixed;
  bottom:0;
  z-index:10;
  gap:10px;
}
.footer-left{
  justify-self:start;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.footer-left a{ color:#fff; text-decoration:none; font-weight:700; }
.footer-center a{ color:#fff; text-decoration:none; font-weight:900; text-transform:uppercase; font-size:22px; }
.footer-right{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:10px;
}
.footbtn{
  width:42px;
  height:42px;
  border-radius:999px;
  display:grid;
  place-items:center;
  border:2px solid #fff;
  background:rgba(21,20,89,.55);
  color:#fff;
  font-weight:900;
  font-size:16px;
  text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

/* ===== RESPONSIVE ===== */
@media (max-width:900px){
  .noticia-contenido{
    flex-direction:column;
    gap:20px;
  }
  .noticia-img img{
    max-height:300px;
  }
  .brand h1{ font-size:30px; }
  .brand p{ font-size:14px; }
  .navbtn{ width:42px; height:42px; font-size:16px; }
  .noticia-titulo-wrapper h2{ font-size:30px; }
  .icono-noticia{ width:28px; height:28px; }
}
</style>

</head>
<body>

  <!-- ========= BANNER ========= -->
  <section class="seccion-noticia banner">
    <div class="overlay"></div>
    <div class="banner-header">
      <div class="left-cluster">
        <span class="badge badge--ghost" id="fecha">Fecha</span>
        <button id="adminButton" class="admin-btn">Admin</button>
      </div>
      <div class="brand">
        <h1>IA NEWSROOM</h1>
        <p>NOTICIAS DE TECNOLOGÍA</p>
      </div>
      <nav class="navnums" aria-label="Navegación por noticias">
        <a class="navbtn" href="#t1">1</a>
        <a class="navbtn" href="#t2">2</a>
        <a class="navbtn" href="#t3">3</a>
        <a class="navbtn" href="#t4">4</a>
        <a class="navbtn" href="#t5">5</a>
      </nav>
    </div>

    <div class="banner-contenido">
      <div class="frase-del-dia" id="fraseDia">
        <div class="frase-header">
          <img src="assets/icons/chip.svg" class="icono-chip" alt="Icono chip">
          <span>Frase del Día</span>
        </div>
        <p id="textoFrase">Cargando frase del día...</p>
        <span id="autorFrase"></span>
      </div>
    </div>
  </section>

  <!-- ========= CONTENEDOR DE NOTICIAS DINÁMICAS ========= -->
  <div id="noticias">
    <section class="seccion-noticia noticia-1" id="n1"></section>
    <section class="seccion-noticia noticia-2" id="n2"></section>
    <section class="seccion-noticia noticia-3" id="n3"></section>
    <section class="seccion-noticia noticia-4" id="n4"></section>
    <section class="seccion-noticia noticia-5" id="n5"></section>
    <section class="seccion-noticia noticia-6" id="n6" style="display:none"></section>
    <section class="seccion-noticia noticia-7" id="n7" style="display:none"></section>
    <section class="seccion-noticia noticia-8" id="n8" style="display:none"></section>
    <section class="seccion-noticia noticia-9" id="n9" style="display:none"></section>
    <section class="seccion-noticia noticia-10" id="n10" style="display:none"></section>
    <section class="seccion-noticia noticia-11" id="n11" style="display:none"></section>
    <section class="seccion-noticia noticia-12" id="n12" style="display:none"></section>
    <section class="seccion-noticia noticia-13" id="n13" style="display:none"></section>
    <section class="seccion-noticia noticia-14" id="n14" style="display:none"></section>
    <section class="seccion-noticia noticia-15" id="n15" style="display:none"></section>
    <section class="seccion-noticia noticia-16" id="n16" style="display:none"></section>
    <section class="seccion-noticia noticia-17" id="n17" style="display:none"></section>
    <section class="seccion-noticia noticia-18" id="n18" style="display:none"></section>
  </div>

  <!-- ========= PANEL ADMIN (oculto) ========= -->
  <div id="passwordInput" style="display:none; text-align:center; margin:20px;">
    <input type="password" id="adminPass" placeholder="Introduce contraseña" />
    <button id="loginButton">Entrar</button>
    <div id="adminStatus"></div>
  </div>

  <!-- ========= FOOTER ========= -->
  <footer class="footer">
    <div class="footer-left">
      <a href="http://github.com/CrojasGit" target="_blank" rel="noopener noreferrer">CARLOS ROJAS GOMÁRIZ</a>
      <a href="https://github.com/marianaangarita" target="_blank" rel="noopener noreferrer">MARIANA ELVIRA ANGARITA AFONSO</a>
    </div>
    <div class="footer-center">
      <a href="https://github.com/CrojasGit/TrabajoEDD_GitHub_Pages/blob/main/README.md" target="_blank" rel="noopener noreferrer">README</a>
    </div>
    <div class="footer-right" aria-label="Navegación inferior">
      <a class="footbtn" href="#t1">1</a>
      <a class="footbtn" href="#t2">2</a>
      <a class="footbtn" href="#t3">3</a>
      <a class="footbtn" href="#t4">4</a>
      <a class="footbtn" href="#t5">5</a>
    </div>
  </footer>

  <script src="noticiasIA.js"></script>
</body>
</html>
